version: 2

project_name: version

gitlab_urls:
  api: https://gitsrv.svyazcom.ru/api/v4
  download: https://gitsrv.svyazcom.ru
  skip_tls_verify: false

before:
  hooks:
    - go mod tidy
    - bash -lc './buildtools/create-gitlab-installers.sh {{ .Tag }}'

builds:
  - id: version
    main: ./cmd/version
    binary: version
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.appVersion={{ .Version }}
      - -extldflags "-static"

archives:
  - id: default
    ids: [version]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - src: "packaging/linux/install.sh"
        dst: "install.sh"

checksum:
  name_template: "checksums.txt"

release:
  prerelease: auto
  draft: false
  extra_files:
    - glob: "installers-gitlab/version-linux-*-install.sh"
    - glob: "installers-gitlab/version-darwin-*-install.sh"
